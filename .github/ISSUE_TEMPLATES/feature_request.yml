name: 🚀 Feature request
description: Suggest an idea for this project
title: '[Feature]: '
labels: enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 'What problem are you trying to solve?'
      description: A clear and concise description of what the problem is.
      placeholder: |
        e.g. As a ___,
        I want to ___,
        so that ___
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you would like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: What is the criteria for testers to pass this feature?
      description: |
        A clear and concise description of all acceptance criteria in a check-list format.
        The more details you can provide, the better.
      placeholder: |
        - [ ] Click on ...
        - [ ] Type ...
        - [ ] ...
        - [ ] Click ...
        - [ ] Ensure ...
    validations:
      required: false

  - type: textarea
    id: alternatives-considered
    attributes:
      label: Describe alternatives you've considered.
      description: |
        A clear and concise description of any alternative solutions or features you've considered.
        Can you already do this, but in a less convenient way?
        Can you do this using other applications/processes?
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false
