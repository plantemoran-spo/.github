name: Release

on:
  workflow_dispatch:
    inputs:
      bumpType:
        description: "Type of version bump (major, minor, or patch)"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

  push:
    branches:
      - develop

env:
  NODE_VERSION: 22.x

jobs:
  release:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js ${{ env.NODE_VERSION }} installation
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump package version only
        run: npm version ${{ inputs.bumpType || 'patch' }} --no-git-tag-version

      - name: Read version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update changelog
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const root = process.cwd();
            const changelogPath = path.join(root, 'CHANGELOG.md');
            const packagePath = path.join(root, 'package.json');

            const changelog = fs.readFileSync(changelogPath, 'utf8');
            const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));

            if(!pkg.version) {
              throw new Error('package.json does not contain a version field.');
            }

            const today = new Date().toISOString().slice(0, 10);
            const releaseHeading = `## ${today} v${pkg.version}`;

            const unreleasedHeaderRegex = /^##(?: \d{4}-\d{2}-\d{2})? Unreleased\s*$/m;
            const unreleasedMatch = changelog.match(unreleasedHeaderRegex);

            if(!unreleasedMatch || unreleasedMatch.index === undefined) {
              throw new Error('Could not find and Unreleased section in CHANGELOG.md.');
            }

            const headerStart = unreleasedMatch.index;
            const headerEnd = headerStart + unreleasedMatch[0].length;

            const afterHeader = changelog.slice(headerEnd);
            const nextSectionMatch = afterHeader.match(/\n## /);

            const unreleasedBody = nextSectionMatch
              ? afterHeader.slice(0, nextSectionMatch.index)
              : afterHeader;
            const unreleasedSection = `${unreleasedMatch[0]}${unreleasedBody}`;

            if(!/\S/.test(unreleasedBody)) {
              throw new Error('The Unreleased section is empty. Refusing to create a release entry.');
            }

            const releasedSection = `${releaseHeading}${unreleasedBody}`;
            const replacement = `## Unreleased\n\n${releasedSection}`;

            const updated = changelog.replace(unreleasedSection, replacement);
            fs.writeFileSync(changelogPath, updated);

            console.log(`Updated CHANGELOG.md for v${pkg.version} on ${today}`);

      - name: Commit release
        run: |
          git add CHANGELOG.md package.json package-lock.json
          git commit -m "action(release): v$VERSION"

      - name: Create tag
        run: git tag -a "v$VERSION" -m "Version $VERSION"

      - name: Push changes
        run: |
          git push origin develop
          git push origin "v$VERSION"
